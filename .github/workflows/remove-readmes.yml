name: Remove LeetSync README files

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove-readmes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove README files from problem folders
        run: |
          find . -type f -name "README.md" \
            ! -path "./.git/*" \
            ! -path "./README.md" \
            -delete

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No README files to remove."
          else
            git commit -m "Arrangement based on Patterns & Cleanup"
            git push
          fi
